<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin · PlantDiagnose</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-shell">
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <div class="logo-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M2 12h20M7 7l10 10M7 17l10-10"/></svg></div>
      <span class="logo-text">PlantDiagnose</span>
    </div>
    <nav class="sidebar-nav">
      <a class="nav-link" data-page="dashboard.html" href="dashboard.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg><span>Dashboard</span></a>
      <a class="nav-link active" data-page="admin.html" href="admin.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l7 4v5c0 4.4-2.8 7.8-7 9-4.2-1.2-7-4.6-7-9V7z"/><path d="M9 12l2 2 4-4"/></svg><span>Admin</span></a>
    </nav>
    <div class="sidebar-logout">
      <a href="index.html" class="nav-link" data-logout><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg><span>Logout</span></a>
    </div>
  </aside>
  <div class="main-col">
    <header class="topnav">
      <button class="mobile-menu-btn" id="mobileMenuBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
      <div class="topnav-right">
        <div class="dropdown" id="profileDropdown">
          <button class="profile-btn" id="profileBtn">
            <span class="avatar">AD</span>
            <span class="text-sm" style="display:none" id="profileName">Admin</span>
          </button>
          <div class="dropdown-menu">
            <div class="dd-label">My Account</div>
            <hr class="separator" style="margin:.25rem 0">
            <a href="settings.html">Settings</a>
            <hr class="separator" style="margin:.25rem 0">
            <button class="dd-danger" data-logout>Logout</button>
          </div>
        </div>
      </div>
    </header>
    <main class="page-content">
      <h1>Admin Dashboard</h1>
      <p class="text-muted">Manage users, botanists, and diagnoses from one place.</p>

      <div class="grid grid-4 mt-4">
        <div class="card admin-stat-card admin-stat-card--users stat-card">
          <div>
            <p class="stat-label">Total Users</p>
            <p class="stat-value" id="statUsers">0</p>
            <p class="stat-sub">Active accounts</p>
          </div>
          <div class="stat-icon-wrap" style="background:#dcfce7;color:#166534"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><path d="M20 8v6"/><path d="M23 11h-6"/></svg></div>
        </div>
        <div class="card admin-stat-card admin-stat-card--botanists stat-card">
          <div>
            <p class="stat-label">Botanists</p>
            <p class="stat-value" id="statBotanists">0</p>
            <p class="stat-sub">Experts onboarded</p>
          </div>
          <div class="stat-icon-wrap" style="background:#dbeafe;color:#1d4ed8"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></div>
        </div>
        <div class="card admin-stat-card admin-stat-card--admins stat-card">
          <div>
            <p class="stat-label">Admins</p>
            <p class="stat-value" id="statAdmins">0</p>
            <p class="stat-sub">Management access</p>
          </div>
          <div class="stat-icon-wrap" style="background:#f5f3ff;color:#7c3aed"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l7 4v5c0 4.4-2.8 7.8-7 9-4.2-1.2-7-4.6-7-9V7z"/><path d="M9 12l2 2 4-4"/></svg></div>
        </div>
        <div class="card admin-stat-card admin-stat-card--diagnoses stat-card">
          <div>
            <p class="stat-label">Diagnoses</p>
            <p class="stat-value" id="statDiagnoses">0</p>
            <p class="stat-sub">Cases logged</p>
          </div>
          <div class="stat-icon-wrap" style="background:#fff7ed;color:#c2410c"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg></div>
        </div>
      </div>

      <div class="card mt-4 admin-table-card">
        <div class="flex items-center justify-between mb-3">
          <h3>Users</h3>
          <span class="badge badge-green">Live overview</span>
        </div>
        <div id="usersTable" class="mt-3"></div>
      </div>
    </main>
  </div>
</div>
<script src="js/api.js"></script>
<script src="js/main.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
