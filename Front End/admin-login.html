<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login · PlantDiagnose</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="login-page">
    <div class="login-box">
      <div class="login-logo-wrap">
        <div class="login-logo-mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M2 12h20M7 7l10 10M7 17l10-10"/></svg>
        </div>
        <h1>PlantDiagnose</h1>
        <p>Admin Access</p>
      </div>

      <div class="card">
        <div class="card-header">
          <div class="card-title">Admin Sign In</div>
          <div class="card-description">Use your admin credentials to continue.</div>
        </div>
        <div class="card-content">
          <form id="adminLoginForm" class="space-y-4">
            <div class="field"><label for="adminEmail">Email</label><input id="adminEmail" type="email" placeholder="admin@example.com" required></div>
            <div class="field"><label for="adminPassword">Password</label><input id="adminPassword" type="password" placeholder="••••••••" required></div>
            <button type="submit" class="btn btn-primary btn-block" id="adminLoginSubmit">Sign In as Admin</button>
          </form>
        </div>
      </div>

      <div class="mt-3 text-center">
        <a href="login.html" class="btn btn-link">Back to user login</a>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/admin-login.js"></script>
</body>
</html>
